name: Update docs

# Regenerates docs/ (tab text, code map, data dictionary, research index and the backend files) after every push
# and commits the result, so nobody has to run tools/export-docs.js by hand. Runs on GitHub, not in anyone's Claude session.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate docs
        run: node tools/export-docs.js
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then echo "Docs already up to date"; exit 0; fi
          git commit -m "Update docs"
          git pull --rebase
          git push
